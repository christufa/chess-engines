# The image on every PR (the required "containers" check): build, run it the way the
# cluster does (non-root, read-only root filesystem, no capabilities) and analyse the
# starting position with real Stockfish, then Trivy (fail on fixable criticals).
# images.yml does the same on main before publishing.
name: containers

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: chess-engines:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          build-args: CODE_VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=chess-engines
          cache-to: type=gha,scope=chess-engines,mode=max

      - name: Smoke test
        run: .github/scripts/smoke.sh "$IMAGE"

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          severity: CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy.json
          exit-code: "0"
          trivyignores: .trivyignore

      - name: Fail on fixable critical vulnerabilities
        run: python3 .github/scripts/trivy_report.py trivy.json chess-engines
