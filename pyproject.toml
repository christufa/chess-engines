[project]
name = "chess-engines"
version = "0.1.0"
description = "Shared chess-engine analysis service: UCI engines (Stockfish) over HTTP"
readme = "README.md"
requires-python = ">=3.13"
# Exact pins: the image and CI install from uv.lock; Dependabot bumps these.
dependencies = [
    "chess==1.11.2",
    "fastapi==0.156.1",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.3",
    "ruff==0.17.1",
]
# The browser smoke test in containers.yml (tests/browser_smoke.py); not needed for pytest.
browser = [
    "playwright==1.64.0",
]

[project.scripts]
chess-engines = "chess_engines.__main__:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_engines"]
# The playground build, copied in by docker/Dockerfile (gitignored, so listed explicitly).
artifacts = ["src/chess_engines/web/**"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engine: needs a real Stockfish binary (STOCKFISH_PATH)"]
