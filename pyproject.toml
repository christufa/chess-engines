[project]
name = "chess-engines"
version = "0.1.0"
description = "Shared chess-engine analysis service: UCI engines (Stockfish) over HTTP"
readme = "README.md"
requires-python = ">=3.13"
# Exact pins: the image and CI install from uv.lock; Dependabot bumps these.
dependencies = [
    "chess==1.11.2",
    "fastapi==0.156.1",
    "pydantic==2.12.3",
    "pyyaml==6.0.3",
    "uvicorn==0.38.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.2",
    "ruff==0.14.3",
]

[project.scripts]
chess-engines = "chess_engines.__main__:main"

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_engines"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["engine: needs a real Stockfish binary (STOCKFISH_PATH)"]
